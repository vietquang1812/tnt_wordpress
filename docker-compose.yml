version: '3.8'

services:
  # Service Nginx đóng vai trò Web Server
  webserver:
    image: nginx:alpine
    container_name: wp_webserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tnt-theme:/var/www/html/wp-content/themes/tnt-theme
    depends_on:
      - wordpress

  # Service WordPress chạy PHP mới nhất từ Dockerfile ở trên
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wp_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - ./app:/var/www/html
      - ./tnt-theme:/var/www/html/wp-content/themes/tnt-theme
    depends_on:
      - db

  # Service Cơ sở dữ liệu MySQL
  db:
    image: mysql:latest
    container_name: wp_db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: